<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Workshop — Key2Enable Game Hub</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/vault.css">
  <script src="../site-config.js"></script>
  <script src="../assets/js/gate.js" data-game="game-04" data-encrypted></script>
</head>
<body>
  <!-- This game is encrypted: the real page is game.enc, decrypted in the
       browser with the game's code (see assets/js/vault.js). -->
  <main class="vault">
    <p class="vault__brand">Key2Enable · Game Hub</p>
    <p id="k2eVaultStatus" class="vault__status" role="status" aria-live="polite">Opening…</p>
    <div id="k2eVaultBar" class="vault__bar" aria-hidden="true" hidden><span></span></div>
    <p id="k2eVaultHint" class="vault__hint" hidden>Large game file — on slow Wi-Fi this can take a little while. Please keep the tab open.</p>
    <noscript><p class="vault__status" data-error>This game needs JavaScript. Please enable it and reload.</p></noscript>
  </main>
  <script src="../assets/js/vault.js" data-src="game.enc"></script>
</body>
</html>
