<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Workshop — Key2Enable Game Hub</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/vault.css">
  <script src="../assets/js/vault.js"></script>
</head>
<body>
  <!-- This game is encrypted: the real page is game.enc. The lab build
       opens automatically — no code entry needed. -->
  <main class="vault">
    <p class="vault__brand">Key2Enable · Game Hub</p>
    <p id="k2eVaultStatus" class="vault__status" role="status" aria-live="polite">Opening…</p>
  </main>
  <script>
    (function () {
      var st = document.getElementById("k2eVaultStatus");
      function fail(msg) { st.textContent = msg; st.setAttribute("data-error", ""); }
      if (!window.K2E_VAULT || !K2E_VAULT.supported) {
        fail("This browser can't open the game — please use a current Chrome, Edge, Safari or Firefox.");
        return;
      }
      document.documentElement.classList.add("k2e-decrypting");
      fetch("game.enc").then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        return K2E_VAULT.decrypt(atob("Uk9CT1QtNTAyMg=="), buf);
      }).then(function (html) {
        document.documentElement.classList.remove("k2e-decrypting");
        document.open();
        document.write(html);
        document.close();
      }).catch(function (e) {
        fail("Couldn't open the game (" + (e && e.message || e) + "). Please reload.");
      });
    })();
  </script>
</body>
</html>
