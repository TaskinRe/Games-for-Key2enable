/* ---------- K2E story speaking (browser speech recognition) ----------
   Order of use when the child presses Speak on "Write your story":
   1. the K2E voice helper on this computer (127.0.0.1:5005), if it is running (unchanged);
   2. the browser's speech recognition ON THIS DEVICE (Chrome/Edge on-device pack, no audio leaves the computer);
   3. otherwise, automatically, the browser's online speech recognition (Chrome sends the audio to Google for this).
   No setup or switches needed by anyone.
   Words appear live in the story box. Press Speak again (or wait 60 s) to stop. Cross undoes the last spoken part. */
const SPR = window.SpeechRecognition || window.webkitSpeechRecognition;
const WEB = {rec:null, local:null, undo:[], timer:0};
const SR_LANG = 'en-US';

async function webLocalReady(){
  if (WEB.local === true) return true;
  if (!SPR || typeof SPR.available !== 'function') return false;
  try {
    const opts = {langs:[SR_LANG], processLocally:true};
    const st = await SPR.available(opts);
    if (st === 'available'){ WEB.local = true; return true; }
    if (st === 'downloadable' || st === 'downloading'){
      tellStatus('Getting speaking ready on this computer. This happens only once...', true);
      const ok = await SPR.install(opts); WEB.local = !!ok; return WEB.local;
    }
  } catch (e) {}
  return false;
}
/* children rarely say full stops: make each spoken part its own sentence so the story helper can split it */
function tidySpoken(t){
  t = String(t || '').replace(/\s+/g, ' ').trim(); if (!t) return '';
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?]$/.test(t)) t += '.';
  return t + ' ';
}
function tellSnap(){ const ta = document.getElementById('tellText'); if (ta){ WEB.undo.push(ta.value); if (WEB.undo.length > 20) WEB.undo.shift(); } }
function tellUndo(){
  slog('undo');
  const ta = document.getElementById('tellText'); if (!ta) return;
  if (WEB.rec){ WEB.rec.abort(); }
  if (!WEB.undo.length){ SND.soft && SND.soft(); tellStatus('Nothing to undo.'); return; }
  ta.value = WEB.undo.pop(); S.tellText = ta.value; SND.tick(); tellStatus('Took back the last part.');
}
function micLabel(on){
  const b = document.getElementById('micBtn'); if (!b) return;
  b.classList.toggle('listening', on); const s = b.querySelector('span'); if (s) s.textContent = on ? 'Stop' : 'Speak';
}
async function micWeb(){
  if (WEB.rec){ WEB.rec.stop(); return; }
  if (!SPR){ tellStatus('Speaking needs Chrome or Edge on this computer. You can pick picture cards instead (Drop).'); return; }
  const local = await webLocalReady();
  if (S.screen !== 'tell') return;
  const ta = document.getElementById('tellText'); if (!ta) return;
  tellSnap();
  const base = ta.value.trim() ? ta.value.trim() + ' ' : '';
  let said = '';
  const rec = new SPR();
  rec.lang = SR_LANG; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
  if (local){ try { rec.processLocally = true; } catch (e) {} }
  rec.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i]; if (r.isFinal) said += tidySpoken(r[0].transcript); else interim += r[0].transcript;
    }
    const t = document.getElementById('tellText'); if (!t) return;
    t.value = (base + said + interim).slice(0, 600); S.tellText = t.value;
  };
  rec.onerror = ev => {
    const why = {
      'not-allowed':'Please press Allow when the browser asks to use the microphone, then press Triangle again.',
      'service-not-allowed':'Please press Allow when the browser asks to use the microphone, then press Triangle again.',
      'audio-capture':'No microphone found. Plug one in, or pick picture cards (Drop).',
      'no-speech':'I did not hear anything. Press Triangle and try again.',
      'network':'Online speaking needs the internet. Try again, or pick picture cards (Drop).',
      'language-not-supported':'Speaking in this language is not ready on this computer.'
    }[ev.error];
    if (why) WEB.err = why;
  };
  rec.onend = () => {
    clearTimeout(WEB.timer); WEB.rec = null; micLabel(false); slog('speak', {on:false, ms:Math.round(performance.now() - (WEB.t0 || 0)), chars:said.length, err:WEB.err ? 1 : 0});
    const t = document.getElementById('tellText');
    if (t){ t.value = (base + said).trim().slice(0, 600); S.tellText = t.value; }
    if (WEB.err){ tellStatus(WEB.err); WEB.err = ''; WEB.undo.pop(); return; }
    if (said.trim()){ SND.snap && SND.snap(); tellStatus('Got it! Press Triangle to say more, Cross to take it back, or Star to make your story.'); }
    else { WEB.undo.pop(); tellStatus('I did not catch that. Press Triangle and try again, a little louder.'); }
  };
  try { rec.start(); } catch (e){ tellStatus('Speaking could not start. Try again.'); return; }
  WEB.rec = rec; WEB.err = ''; micLabel(true); SND.tick(); WEB.t0 = performance.now(); slog('speak', {on:true, local:!!local});
  tellStatus('Listening... tell your story. Press Triangle when you are done.', true);
  WEB.timer = setTimeout(() => { if (WEB.rec) WEB.rec.stop(); }, 60000);
}
/* leaving the story screen always stops the microphone */
new MutationObserver(() => { if (WEB.rec && S.screen !== 'tell'){ WEB.rec.abort(); } })
  .observe(document.getElementById('screen'), {childList:true});


</script>
<script>
/* ---------- K2E press model + study mode (research) ----------
   PRESS MODEL (always on): learns each child's accidental repeat presses (tremor, bounce) from the gap between a
   press and the next press of the SAME button. A 2-part Gaussian mixture on log(gap) is refit online (EM) on the
   last 80 gaps: the short part = accidental, the long part = meant. The new debounce is where the two parts are
   equally likely. "ML advises, rules decide": it only changes after 12 gaps, when the parts are clearly apart,
   moves 30% per update, and stays between 250 and 1000 ms. Starts at 400 ms (the old fixed value).
   STUDY MODE (only when the link has ?study=ID): logs every press and game event in memory (no storage, no audio,
   no story text, no names). Condition from ?cond=A (fixed 400 ms, model only watches) or ?cond=B (adaptive, default).
   Researcher keys: Ctrl+Shift+S saves the log as a JSON file, Ctrl+Shift+I marks an adult intervention. */
const PRESS = {debounce:400, base:400, gaps:[], fit:null, suggest:400, lastT:-1e9, lastN:0, rawT:-1e9, rawN:0, adapt:true, updates:0};
const STUDY = (() => {
  const p = new URLSearchParams(location.search), id = p.get('study') || '';
  const ok = /^[A-Za-z0-9_-]{1,12}$/.test(id), cond = (p.get('cond') || 'B').toUpperCase() === 'A' ? 'A' : 'B';
  return {on:ok, id:ok ? id : '', cond, t0:performance.now(), wall:new Date().toISOString(), ev:[], saved:0, inter:0};
})();
PRESS.adapt = !STUDY.on || STUDY.cond === 'B';

function studyPl(){ return S.players === 2 ? (S.turn || 0) + 1 : (typeof TG !== 'undefined' && TG.on ? (TG.me || 0) + 1 : 1); }
function slog(type, d){
  if (!STUDY.on || STUDY.ev.length > 60000) return;
  /* pl: which child acted. 1 alone; 1 or 2 when two builders share a screen (whose turn it is); on two computers, this computer's builder */
  const pl = studyPl();
  STUDY.ev.push(Object.assign({i:STUDY.ev.length, t:Math.round(performance.now() - STUDY.t0), type, scr:S.screen, pl, np:S.players === 2 ? 2 : 1}, d || {}));
}
/* 1-D two-component Gaussian mixture, EM, on log gaps */
function gmm2(x){
  const n = x.length; if (n < 2) return null;
  const s = x.slice().sort((a, b) => a - b);
  let m = [s[Math.floor(n * .2)], s[Math.floor(n * .8)]], v = [.1, .1], w = [.5, .5];
  const pdf = (xi, mi, vi) => Math.exp(-(xi - mi) * (xi - mi) / (2 * vi)) / Math.sqrt(2 * Math.PI * vi);
  for (let it = 0; it < 30; it++){
    const r = x.map(xi => { const a = w[0] * pdf(xi, m[0], v[0]), b = w[1] * pdf(xi, m[1], v[1]), z = a + b || 1e-12; return a / z; });
    const r0 = r.reduce((a, b) => a + b, 0), r1 = n - r0;
    if (r0 < 1e-6 || r1 < 1e-6) break;
    m = [x.reduce((a, xi, i) => a + r[i] * xi, 0) / r0, x.reduce((a, xi, i) => a + (1 - r[i]) * xi, 0) / r1];
    v = [Math.max(.004, x.reduce((a, xi, i) => a + r[i] * (xi - m[0]) ** 2, 0) / r0), Math.max(.004, x.reduce((a, xi, i) => a + (1 - r[i]) * (xi - m[1]) ** 2, 0) / r1)];
    w = [r0 / n, r1 / n];
  }
  if (m[0] > m[1]){ m.reverse(); v.reverse(); w.reverse(); }
  /* boundary: where w0*N0 = w1*N1, searched between the two means */
  let lo = m[0], hi = m[1];
  for (let k = 0; k < 40; k++){ const mid = (lo + hi) / 2; if (w[0] * pdf(mid, m[0], v[0]) > w[1] * pdf(mid, m[1], v[1])) lo = mid; else hi = mid; }
  return {m, v, w, cut:Math.exp((lo + hi) / 2)};
}
function pressLearn(gap){
  PRESS.gaps.push(Math.log(gap)); if (PRESS.gaps.length > 80) PRESS.gaps.shift();
  if (PRESS.gaps.length < 12) return;
  const f = gmm2(PRESS.gaps); if (!f) return; PRESS.fit = f;
  const apart = f.m[1] - f.m[0] > 0.5 && f.w[0] >= 0.08 && f.w[0] <= 0.6;     // two real groups, not one blob
  if (!apart) return;
  PRESS.suggest = Math.round(Math.min(1000, Math.max(250, f.cut * 1.1)));
  const before = PRESS.debounce;
  if (PRESS.adapt) PRESS.debounce = Math.round(Math.min(1000, Math.max(250, .7 * PRESS.debounce + .3 * PRESS.suggest)));
  PRESS.updates++;
  slog('model', {suggest:PRESS.suggest, debounce:PRESS.debounce, before, m:f.m.map(x => Math.round(Math.exp(x))), w:f.w.map(x => +x.toFixed(3)), nGaps:PRESS.gaps.length});
}
/* every raw button press goes through here; returns true when the press should count */
function pressGate(n, src){
  const t = performance.now();
  const gapAny = t - PRESS.lastT, gapRaw = t - PRESS.rawT, same = n === PRESS.rawN;
  if (same && gapRaw < 2500) pressLearn(gapRaw);              // learn from raw same-button gaps, counted or not
  PRESS.rawT = t; PRESS.rawN = n;
  const ok = gapAny >= PRESS.debounce;
  slog('press', {n, src, ok, gap:Math.round(Math.min(gapAny, 99999)), same:n === PRESS.lastN, db:PRESS.debounce, sug:PRESS.suggest});
  if (!ok) return false;
  PRESS.lastT = t; PRESS.lastN = n; lastKey = t;
  return true;
}

/* ---------- study log helpers ---------- */
function studySave(auto){
  if (!STUDY.on) return; STUDY.seq = (STUDY.seq || 0) + 1;
  const out = {schema:'k2e-brick-study/1', game:'brick-builder', participant:STUDY.id, condition:STUDY.cond, started:STUDY.wall,
    saved:new Date().toISOString(), screen:{w:innerWidth, h:innerHeight}, press:{final:PRESS.debounce, suggest:PRESS.suggest, updates:PRESS.updates, fit:PRESS.fit},
    interventions:STUDY.inter, seq:STUDY.seq, auto:!!auto, events:STUDY.ev};
  const blob = new Blob([JSON.stringify(out)], {type:'application/json'}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'k2e-brick-' + STUDY.id + '-' + STUDY.cond + '-' + STUDY.wall.replace(/[:.]/g, '-') + '-' + String(STUDY.seq).padStart(3, '0') + '.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  STUDY.saved = STUDY.ev.length; if (!auto) toast('Study log saved (' + STUDY.ev.length + ' events)');
}
if (STUDY.on){
  const b = document.createElement('div'); b.id = 'studyTag'; b.textContent = STUDY.id + ' · ' + STUDY.cond;
  b.style.cssText = 'position:fixed;left:50%;bottom:4px;transform:translateX(-50%);font:600 11px/1 system-ui,sans-serif;color:#8C7A66;opacity:.55;z-index:50;pointer-events:none';
  document.body.append(b);
  /* coarse device context only (no fingerprint): browser family and major version, OS family, pixel ratio, pointer type */
  const ua = navigator.userAgent, br = (/Edg\/(\d+)/.exec(ua) && 'Edge ' + /Edg\/(\d+)/.exec(ua)[1]) || (/Chrome\/(\d+)/.exec(ua) && 'Chrome ' + /Chrome\/(\d+)/.exec(ua)[1]) || (/Firefox\/(\d+)/.exec(ua) && 'Firefox ' + /Firefox\/(\d+)/.exec(ua)[1]) || (/Version\/(\d+).*Safari/.exec(ua) && 'Safari ' + /Version\/(\d+)/.exec(ua)[1]) || 'other';
  const os = /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'macOS' : /CrOS/.test(ua) ? 'ChromeOS' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Linux/.test(ua) ? 'Linux' : 'other';
  slog('session', {cond:STUDY.cond, w:innerWidth, h:innerHeight, browser:br, os, dpr:Math.round(devicePixelRatio * 100) / 100, coarse:matchMedia('(pointer: coarse)').matches, schema:2});
  /* key dwell (how long a button is held) and operating-system auto-repeats: direct, objective signs of a held button */
  const down = {};
  window.addEventListener('keydown', e => { const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || ''); if (!m || e.ctrlKey) return; const n = +m[1];
    if (e.repeat){ if (down[n]) down[n].rep++; return; } down[n] = {t:performance.now(), rep:0, pl:studyPl()}; }, true);
  window.addEventListener('keyup', e => { const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || ''); if (!m) return; const n = +m[1], d = down[n]; if (!d) return;
    delete down[n]; slog('hold', {n, ms:Math.round(performance.now() - d.t), rep:d.rep, pl:d.pl}); }, true);
  /* auto-save: a full copy every 10 minutes of new activity and when the tab is hidden; each file holds the whole log so far (seq numbers them) */
  STUDY.seq = 0; setInterval(() => { if (STUDY.ev.length > STUDY.saved + 20) studySave(true); }, 600000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && STUDY.ev.length > STUDY.saved + 1) studySave(true); });
  window.addEventListener('keydown', e => {
    if (!(e.ctrlKey && e.shiftKey)) return;
    if (e.code === 'KeyS'){ e.preventDefault(); e.stopImmediatePropagation(); slog('save'); studySave(); }
    /* observer labels: ground truth for the press model. X = the last press was NOT meant (a bump or tremor). M = the child pressed on purpose but nothing happened */
    else if (e.code === 'KeyX'){ e.preventDefault(); e.stopImmediatePropagation(); const lp = [...STUDY.ev].reverse().find(v => v.type === 'press'); slog('label', {kind:'unintended', press:lp ? lp.i : -1}); toast('Marked: last press not meant'); }
    else if (e.code === 'KeyM'){ e.preventDefault(); e.stopImmediatePropagation(); const lp = [...STUDY.ev].reverse().find(v => v.type === 'press'); slog('label', {kind:'missed', press:lp ? lp.i : -1}); toast('Marked: a meant press was missed'); }
    else if (e.code === 'KeyI'){ e.preventDefault(); e.stopImmediatePropagation(); STUDY.inter++; slog('intervention', {k:STUDY.inter}); toast('Adult help noted (' + STUDY.inter + ')'); }
  }, true);
  window.addEventListener('beforeunload', e => { if (STUDY.ev.length > STUDY.saved + 1){ e.preventDefault(); e.returnValue = ''; } });
  new MutationObserver(() => slog('screen')).observe(document.getElementById('screen'), {childList:true});
}

</script>
