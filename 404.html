<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Key2Enable Game Hub</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" id="favicon">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #FBF9F4; color: #2B3546; font: 17px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    main { text-align: center; padding: 32px 24px; max-width: 34rem; }
    .brand { margin: 0 0 14px; font-weight: 600; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: #D14E3A; }
    h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 4vw, 2.2rem); color: #17202E; letter-spacing: -.02em; }
    p { margin: 0 0 22px; color: #5F6979; }
    .ar { direction: rtl; font-size: 1.05rem; }
    .btn { display: inline-block; padding: 12px 22px; border-radius: 999px; background: #F0654F; color: #fff; text-decoration: none; font-weight: 600; }
    .btn:hover { background: #D14E3A; }
    .btn:focus-visible { outline: 3px solid #1F6FEB; outline-offset: 3px; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: #F3EFE6; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Key2Enable · Game Hub</p>
    <h1>That page isn’t here</h1>
    <p>The link may have been typed with a mistake, or the game moved. Head back to the hub and pick the game from there.</p>
    <p class="ar">هذه الصفحة غير موجودة — ارجع إلى مركز الألعاب واختر اللعبة من هناك.</p>
    <a class="btn" id="home" href="/">← Back to Game Hub</a>
    <p style="margin-top:22px;font-size:.85rem">Looking for: <code id="path"></code></p>
  </main>
  <script>
    /* GitHub Pages serves this file for any missing URL; the hub lives at the
       repository root, i.e. the first path segment on *.github.io. */
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var root = /\.github\.io$/i.test(location.hostname) && parts.length ? "/" + parts[0] + "/" : "/";
      document.getElementById("home").href = root;
      document.getElementById("favicon").href = root + "assets/img/favicon.svg";
      document.getElementById("path").textContent = location.pathname;
    })();
  </script>
</body>
</html>
